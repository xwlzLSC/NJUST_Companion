[package]
name = "njust-companion-server"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
keyring = { version = "3.6", features = ["windows-native"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "http2", "json", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
